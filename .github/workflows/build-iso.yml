name: Build Igor-Qortal OS ISO

on:
  push:
    branches: [main]
    paths:
      - 'igor-qortal-os-v2-with-logo-embedded.sh'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: igor-qortal-os-iso-build
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y             debootstrap curl wget git xorriso squashfs-tools             grub-efi-amd64-bin grub-efi-amd64-signed shim-signed             dosfstools mtools cpio debian-archive-keyring

          # Ubuntu 24.04 ships an older live-build which lacks the
          # --bootloaders option used by the V2 builder. Use Debian
          # Trixie's live-build instead.
          wget -q https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          sudo dpkg -i live-build_20250505+deb13u1_all.deb
          sudo apt-get -f install -y
          echo "Using live-build:"
          lb --version

      - name: Build ISO
        env:
          DEBIAN_FRONTEND: noninteractive
          DISTRO: unstable
          SKIP_HOST_DEPS: "1"
          BUILD_DIR: igor-qortal-os-build
          OUTPUT_ISO: igor-qortal-os-v2.iso
        run: |
          chmod +x ./igor-qortal-os-v2-with-logo-embedded.sh
          printf '1\n' | sudo -E bash ./igor-qortal-os-v2-with-logo-embedded.sh

      - name: Verify ISO
        run: |
          test -s igor-qortal-os-v2.iso
          file igor-qortal-os-v2.iso
          xorriso -indev igor-qortal-os-v2.iso -toc 2>/dev/null | head -80
          sha256sum igor-qortal-os-v2.iso | tee SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: igor-qortal-os-v2-iso
          path: |
            igor-qortal-os-v2.iso
            SHA256SUMS
          compression-level: 0
          retention-days: 30
