name: Build Igor-Qortal OS 64-bit PC ISO

on:
  push:
    branches: [main]
    paths:
      - 'igor-qortal-os-v2-with-logo-embedded.sh'
      - '.github/workflows/build-iso.yml'
      - '.github/iso-auto-repair.sh'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: igor-qortal-os-amd64-iso-build
  cancel-in-progress: true

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debootstrap curl wget git xorriso squashfs-tools \
            dosfstools mtools cpio debian-archive-keyring \
            qemu-user-static binfmt-support shellcheck
          wget -q https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250814_all.deb
          sudo dpkg -i live-build_20250814_all.deb || sudo apt-get -f install -y
          lb --version

      - name: Validate and safely repair builder
        run: |
          chmod +x ./igor-qortal-os-v2-with-logo-embedded.sh
          ./.github/iso-auto-repair.sh
          bash -n ./igor-qortal-os-v2-with-logo-embedded.sh
          shellcheck -x -S error ./igor-qortal-os-v2-with-logo-embedded.sh || true

      - name: Build AMD64 / x86_64 ISO
        env:
          DEBIAN_FRONTEND: noninteractive
          DISTRO: unstable
          ARCH: amd64
          SKIP_HOST_DEPS: '1'
          BUILD_DIR: igor-qortal-os-build-amd64
          OUTPUT_ISO: igor-qortal-os-amd64.iso
          BOOTLOADER: iso-syslinux-grub
        run: |
          printf '1\n' | sudo -E bash ./igor-qortal-os-v2-with-logo-embedded.sh

      - name: Verify output
        run: |
          test -s igor-qortal-os-amd64.iso
          file igor-qortal-os-amd64.iso
          sha256sum igor-qortal-os-amd64.iso | tee igor-qortal-os-amd64.iso.sha256

      - name: Upload AMD64 ISO
        uses: actions/upload-artifact@v4
        with:
          name: igor-qortal-os-amd64
          path: |
            igor-qortal-os-amd64.iso
            igor-qortal-os-amd64.iso.sha256
          compression-level: 0
          retention-days: 30
