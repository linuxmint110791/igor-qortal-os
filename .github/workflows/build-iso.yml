name: Build Igorcoin Qortal OS — Debian 13 Trixie

on:
  push:
    branches: [main]
    paths:
      - 'build-iso.sh'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: igorcoin-qortal-os-debian13-iso
  cancel-in-progress: true

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Debian 13 live ISO
        run: |
          chmod +x ./build-iso.sh
          sudo ./build-iso.sh

      - name: Verify ISO and checksum
        run: |
          test -s igorcoin-qortal-os-debian13-amd64.iso
          sha256sum -c igorcoin-qortal-os-debian13-amd64.iso.sha256
          file igorcoin-qortal-os-debian13-amd64.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: igorcoin-qortal-os-debian13-trixie-amd64
          path: |
            igorcoin-qortal-os-debian13-amd64.iso
            igorcoin-qortal-os-debian13-amd64.iso.sha256
          compression-level: 0
          retention-days: 30
