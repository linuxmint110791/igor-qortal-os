name: Build IgorCoin-Qortal OS (Archiso)
on:
  push:
    branches: [main]
    paths:
      - 'archiso/**'
      - 'build.sh'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, e.g. v1.0.0-arch1. Leave empty for artifact only.'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: igorcoin-qortal-archiso
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Restore Arch package cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/igorcoin-pacman-cache
          key: arch-pacman-${{ runner.os }}-${{ hashFiles('archiso/packages.x86_64', 'archiso/pacman.conf') }}
          restore-keys: |
            arch-pacman-${{ runner.os }}-
      - name: Prepare package cache
        run: mkdir -p "${RUNNER_TEMP}/igorcoin-pacman-cache"
      - name: Build in privileged Arch container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull archlinux:base-devel
          docker run --rm --privileged --network host \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE/archiso:/work" -w /work \
            archlinux:base-devel bash /work/scripts/container-build.sh
      - name: Verify ISO and checksum
        run: |
          set -Eeuo pipefail
          test -s archiso/out/igorcoin-qortal-os-x86_64.iso
          cd archiso/out
          sha256sum -c igorcoin-qortal-os-x86_64.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: igorcoin-qortal-os-x86_64
          path: |
            archiso/out/igorcoin-qortal-os-x86_64.iso
            archiso/out/igorcoin-qortal-os-x86_64.iso.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release when a tag was requested
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          gh release create "$RELEASE_TAG" \
            archiso/out/igorcoin-qortal-os-x86_64.iso \
            archiso/out/igorcoin-qortal-os-x86_64.iso.sha256 \
            --title "IgorCoin-Qortal OS $RELEASE_TAG" \
            --notes "Archiso x86_64 build. Verify SHA-256 before writing the ISO to USB. Experimental until hardware and installer tests pass." \
            --latest
