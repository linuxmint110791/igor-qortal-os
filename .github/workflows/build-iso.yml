name: Build Igorcoin Qortal OS — Debian 13 Trixie
on:
  push:
    branches: [main]
    paths:
      - 'build-iso.sh'
      - 'wallet/Igorcoin-Wallet.json.age'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: igorcoin-qortal-os-debian13-iso
  cancel-in-progress: true
jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check build script syntax
        run: bash -n ./build-iso.sh
      - name: Build Debian 13 live ISO
        run: |
          chmod +x ./build-iso.sh
          sudo ./build-iso.sh
      - name: Verify ISO file
        run: |
          test -s igorcoin-qortal-os-debian13-amd64.iso
          file igorcoin-qortal-os-debian13-amd64.iso
          du -h igorcoin-qortal-os-debian13-amd64.iso
      - name: Upload ISO as a separate downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Igorcoin-Qortal-OS-Debian13-amd64
          path: igorcoin-qortal-os-debian13-amd64.iso
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
