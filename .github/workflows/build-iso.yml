name: Build Igor-Qortal OS multi-architecture images

on:
  push:
    branches: [main]
    paths:
      - 'igor-qortal-os-v2-with-logo-embedded.sh'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: igor-qortal-os-iso-build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            output: igor-qortal-os-amd64.iso
            artifact: igor-qortal-os-amd64
          - arch: arm64
            output: igor-qortal-os-arm64.img
            artifact: igor-qortal-os-arm64
          - arch: i386
            output: igor-qortal-os-i386.iso
            artifact: igor-qortal-os-i386
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debootstrap curl wget git xorriso squashfs-tools \
            dosfstools mtools cpio debian-archive-keyring \
            qemu-user-static binfmt-support
          wget -q https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250814_all.deb
          sudo dpkg -i live-build_20250814_all.deb
          sudo apt-get -f install -y
          lb --version

      - name: Build image
        env:
          DEBIAN_FRONTEND: noninteractive
          DISTRO: unstable
          ARCH: ${{ matrix.arch }}
          SKIP_HOST_DEPS: '1'
          BUILD_DIR: igor-qortal-os-build-${{ matrix.arch }}
          OUTPUT_ISO: ${{ matrix.output }}
        run: |
          chmod +x ./igor-qortal-os-v2-with-logo-embedded.sh
          printf '1\n' | sudo -E bash ./igor-qortal-os-v2-with-logo-embedded.sh

      - name: Verify output
        run: |
          test -s "${{ matrix.output }}"
          file "${{ matrix.output }}"
          sha256sum "${{ matrix.output }}" | tee "${{ matrix.output }}.sha256"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.output }}
            ${{ matrix.output }}.sha256
          compression-level: 0
          retention-days: 30