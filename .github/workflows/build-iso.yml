name: Build Igorcoin Qortal OS — Debian 13 Trixie
on:
  push:
    branches: [main]
    paths:
      - 'build-iso.sh'
      - 'wallet/Igorcoin-Wallet.json.age'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: igorcoin-qortal-os-debian13-iso
  cancel-in-progress: true
jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check build script syntax
        run: bash -n ./build-iso.sh
      - name: Build Debian ISO (Trixie first, Forky fallback)
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x ./build-iso.sh
          if sudo env DEBIAN_SUITE=trixie ./build-iso.sh; then
            echo "ISO_FILE=igorcoin-qortal-os-trixie-amd64.iso" >> "$GITHUB_ENV"
            echo "Selected Debian suite: Trixie"
          else
            echo "::warning::Debian 13 Trixie build failed. Automatically retrying with Debian Forky."
            sudo env DEBIAN_SUITE=forky ./build-iso.sh
            echo "ISO_FILE=igorcoin-qortal-os-forky-amd64.iso" >> "$GITHUB_ENV"
            echo "Selected Debian suite: Forky fallback"
          fi
      - name: Verify ISO file
        run: |
          test -s "$ISO_FILE"
          file "$ISO_FILE"
          du -h "$ISO_FILE"
      - name: Upload temporary ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Igorcoin-Qortal-OS-amd64
          path: ${{ env.ISO_FILE }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Prepare durable release files
        shell: bash
        run: |
          set -euo pipefail
          ISO="$ISO_FILE"
          mkdir -p release-files
          cp "$ISO" release-files/
          cd release-files
          sha256sum "$ISO" > "$ISO.sha256"
          # GitHub Release assets must each be smaller than 2 GiB.
          # Split into 1800 MiB pieces so even large ISO images fit safely.
          split --bytes=1800M --numeric-suffixes=1 --suffix-length=3 \
            --additional-suffix=.part "$ISO" "$ISO."
          cat > DOWNLOAD-INSTRUCTIONS.txt <<'EOF'
          Igorcoin Qortal OS — ISO reconstruction

          Download every file named igorcoin-qortal-os-<suite>-amd64.iso.NNN.part
          into the same directory, together with the .sha256 file.

          Linux reconstruction:
            cat igorcoin-qortal-os-*.iso.*.part > igorcoin-qortal-os-debian13-amd64.iso
            sha256sum -c igorcoin-qortal-os-<suite>-amd64.iso.sha256

          Do not omit or reorder any part. The checksum must report OK.
          EOF
          ls -lh

      - name: Publish persistent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="igorcoin-os-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release-files/igorcoin-qortal-os-debian13-amd64.iso.*.part \
            release-files/igorcoin-qortal-os-debian13-amd64.iso.sha256 \
            release-files/DOWNLOAD-INSTRUCTIONS.txt \
            --title "Igorcoin Qortal OS ${GITHUB_RUN_NUMBER}" \
            --notes "Debian AMD64 build (Trixie preferred; Forky fallback). ISO is split into numbered parts under GitHub's per-asset size limit. Download all parts and reconstruct using DOWNLOAD-INSTRUCTIONS.txt. Verify with SHA256 before writing to USB." \
            --latest
