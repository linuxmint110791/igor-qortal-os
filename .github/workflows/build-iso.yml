name: Download Official Arch Linux ISO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write

concurrency:
  group: official-arch-linux-iso
  cancel-in-progress: false

jobs:
  download:
    name: Download and verify upstream Arch ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Download the official Arch Linux ISO and checksum manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          BASE_URL="https://geo.mirror.pkgbuild.com/iso/latest"
          curl --fail --location --retry 5 --retry-all-errors \
            "$BASE_URL/archlinux-x86_64.iso" \
            --output dist/archlinux-x86_64.iso
          curl --fail --location --retry 5 --retry-all-errors \
            "$BASE_URL/sha256sums.txt" \
            --output dist/sha256sums.txt

      - name: Verify ISO against the official Arch checksum manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          cd dist
          grep -E '^[[:xdigit:]]{64}[[:space:]]+\*?archlinux-x86_64\.iso$' sha256sums.txt \
            > official-iso.sha256
          test -s official-iso.sha256
          sha256sum --check official-iso.sha256
          cp official-iso.sha256 archlinux-x86_64.iso.sha256
          printf 'Source: https://archlinux.org/download/\nMirror: https://geo.mirror.pkgbuild.com/iso/latest/\n' > SOURCE.txt
          ls -lh archlinux-x86_64.iso archlinux-x86_64.iso.sha256

      - name: Upload verified official ISO
        uses: actions/upload-artifact@v4
        with:
          name: ArchLinux-Official-ISO-amd64
          path: |
            dist/archlinux-x86_64.iso
            dist/archlinux-x86_64.iso.sha256
            dist/SOURCE.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Publish official ISO to a GitHub Release when requested
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "${{ inputs.release_tag }}" \
            dist/archlinux-x86_64.iso \
            dist/archlinux-x86_64.iso.sha256 \
            dist/SOURCE.txt \
            --title "Official Arch Linux ISO ${{ inputs.release_tag }}" \
            --notes "Unmodified official Arch Linux x86_64 installation ISO, downloaded from an Arch mirror and verified against Arch's published SHA-256 manifest. This is not a custom Igorcoin/Qortal image." 
