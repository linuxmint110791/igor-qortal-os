name: Build IgorCoin-Qortal OS (Archiso)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag (leave empty for a unique build tag)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: igorcoin-qortal-archiso
  cancel-in-progress: false

jobs:
  build:
    name: Build custom IgorCoin-Qortal live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install compression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build inside official Arch Linux container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull archlinux:base-devel
          docker run --rm --privileged --network host \
            -v "$GITHUB_WORKSPACE/archiso:/work" -w /work \
            archlinux:base-devel bash /work/scripts/container-build.sh
          sudo chown -R "$(id -u):$(id -g)" archiso/out
          sudo chmod -R u+rwX archiso/out

      - name: Create 2026 folder and reassemble the ISO from two parts
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s archiso/out/amd.iso
          mkdir -p igorcoin-qortal-os/2026
          bash scripts/assemble-iso-2026.sh \
            archiso/out/amd.iso \
            igorcoin-qortal-os/2026

      - name: Compress and verify the single ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          cd igorcoin-qortal-os/2026
          sha256sum --check igorcoin-qortal-os.iso.sha256
          zstd -T0 -6 --no-progress igorcoin-qortal-os.iso -o igorcoin-qortal-os.iso.zst
          zstd -t igorcoin-qortal-os.iso.zst
          EXPECTED="$(awk '{print $1}' igorcoin-qortal-os.iso.sha256)"
          ACTUAL="$(zstd -dc igorcoin-qortal-os.iso.zst | sha256sum | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          echo "Single ISO: $(du -h igorcoin-qortal-os.iso | cut -f1)"
          echo "Compressed ISO: $(du -h igorcoin-qortal-os.iso.zst | cut -f1)"

      - name: Upload one downloadable ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: IgorCoin-Qortal-OS-2026-ISO
          path: |
            igorcoin-qortal-os/2026/igorcoin-qortal-os.iso
            igorcoin-qortal-os/2026/igorcoin-qortal-os.iso.sha256
            igorcoin-qortal-os/2026/igorcoin-qortal-os.iso.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Publish release download (split only if GitHub's per-file limit requires it)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="${INPUT_TAG:-v0.1.1-build.${GITHUB_RUN_NUMBER}}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "IgorCoin-Qortal OS $TAG" \
              --notes "Experimental Arch Linux-based IgorCoin-Qortal OS. Download the ISO artifact or the compressed release assets. Verify SHA256 before writing to USB. Secure Boot signing and physical-hardware validation are not certified."

          mkdir -p release-assets
          cp igorcoin-qortal-os/2026/igorcoin-qortal-os.iso.sha256 release-assets/
          SIZE=$(stat -c%s igorcoin-qortal-os/2026/igorcoin-qortal-os.iso.zst)
          if (( SIZE < 1900000000 )); then
            cp igorcoin-qortal-os/2026/igorcoin-qortal-os.iso.zst release-assets/
            cat > release-assets/README.txt <<'EOF'
          IgorCoin-Qortal OS 2026

          Download igorcoin-qortal-os.iso.zst and igorcoin-qortal-os.iso.sha256.
          Decompress:
            zstd -d igorcoin-qortal-os.iso.zst -o igorcoin-qortal-os.iso
          Verify:
            sha256sum --check igorcoin-qortal-os.iso.sha256
          Write the verified .iso file to USB.
          EOF
            ASSETS=(release-assets/igorcoin-qortal-os.iso.zst release-assets/igorcoin-qortal-os.iso.sha256 release-assets/README.txt)
          else
            echo "::warning::Compressed ISO exceeds GitHub's per-release-asset limit; splitting the compressed download into parts."
            split -b 1800M -d -a 2 igorcoin-qortal-os/2026/igorcoin-qortal-os.iso.zst release-assets/igorcoin-qortal-os.iso.zst.part-
            cat > release-assets/README.txt <<'EOF'
          IgorCoin-Qortal OS 2026 — split compressed download

          Download every igorcoin-qortal-os.iso.zst.part-* file and the SHA256 file.
          Join the compressed parts:
            cat igorcoin-qortal-os.iso.zst.part-* > igorcoin-qortal-os.iso.zst
          Decompress:
            zstd -t igorcoin-qortal-os.iso.zst
            zstd -d igorcoin-qortal-os.iso.zst -o igorcoin-qortal-os.iso
          Verify:
            sha256sum --check igorcoin-qortal-os.iso.sha256
          Write the verified .iso file to USB.
          EOF
            ASSETS=(release-assets/igorcoin-qortal-os.iso.zst.part-* release-assets/igorcoin-qortal-os.iso.sha256 release-assets/README.txt)
          fi

          for asset in igorcoin-qortal-os.iso.zst igorcoin-qortal-os.iso.zst.part-00 igorcoin-qortal-os.iso.zst.part-01 igorcoin-qortal-os.iso.sha256 README.txt; do
            gh release delete-asset "$TAG" "$asset" --yes >/dev/null 2>&1 || true
          done
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
          echo "Published release $TAG"
