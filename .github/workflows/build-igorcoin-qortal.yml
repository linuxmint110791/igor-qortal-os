name: Build IgorCoin-Qortal OS (Archiso)

on:
  push:
    branches: [main]
    paths:
      - 'archiso/**'
      - '.github/workflows/build-igorcoin-qortal.yml'
      - 'README.md'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag (leave empty to use v0.1.0)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: igorcoin-qortal-archiso
  cancel-in-progress: false

jobs:
  build:
    name: Build custom IgorCoin-Qortal live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install compression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build inside official Arch Linux container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull archlinux:base-devel
          docker run --rm --privileged --network host \
            -v "$GITHUB_WORKSPACE/archiso:/work" -w /work \
            archlinux:base-devel bash /work/scripts/container-build.sh
          # The build container runs as root; restore runner ownership for checksum/compression.
          sudo chown -R "$(id -u):$(id -g)" archiso/out
          sudo chmod -R u+rwX archiso/out

      - name: Verify and compress ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s archiso/out/amd.iso
          test -s archiso/out/amd.iso.sha256
          cd archiso/out
          sha256sum --check amd.iso.sha256
          zstd -T0 -19 --no-progress amd.iso -o amd.iso.zst
          zstd -t amd.iso.zst
          EXPECTED="$(awk '{print $1}' amd.iso.sha256)"
          ACTUAL="$(zstd -dc amd.iso.zst | sha256sum | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          echo "Original ISO: $(du -h amd.iso | cut -f1)"
          echo "Compressed ISO: $(du -h amd.iso.zst | cut -f1)"

      - name: Upload complete ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: IgorCoin-Qortal-OS-amd64
          path: |
            archiso/out/amd.iso
            archiso/out/amd.iso.sha256
            archiso/out/amd.iso.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Publish one-file download when it fits GitHub limits
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="${INPUT_TAG:-v0.1.0}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "IgorCoin-Qortal OS $TAG" \
              --notes "Experimental Arch Linux-based IgorCoin-Qortal OS live image. Download amd.iso.zst and decompress it with zstd -d. Verify the resulting ISO using amd.iso.sha256. Secure Boot signing and physical-hardware validation are not yet certified."

          mkdir -p release-assets
          cp archiso/out/amd.iso.sha256 release-assets/
          SIZE=$(stat -c%s archiso/out/amd.iso.zst)
          # Keep below GitHub's 2 GB per-release-asset limit.
          if (( SIZE < 1900000000 )); then
            cp archiso/out/amd.iso.zst release-assets/
            cat > release-assets/README.txt <<'EOF'
IgorCoin-Qortal OS — single-file download

Download amd.iso.zst and amd.iso.sha256.
Decompress:
  zstd -d amd.iso.zst -o amd.iso
Verify:
  sha256sum --check amd.iso.sha256

The checksum must report OK before writing the ISO to USB.
EOF
            ASSETS=(release-assets/amd.iso.zst release-assets/amd.iso.sha256 release-assets/README.txt)
          else
            echo "::warning::Compressed ISO is still too large for one GitHub Release asset; publishing verified split compressed parts."
            split -b 1800M -d -a 2 archiso/out/amd.iso.zst release-assets/amd.iso.zst.part-
            cat > release-assets/README.txt <<'EOF'
IgorCoin-Qortal OS — split compressed download

Download every amd.iso.zst.part-* file and amd.iso.sha256.
Reassemble and decompress:
  cat amd.iso.zst.part-* > amd.iso.zst
  zstd -t amd.iso.zst
  zstd -d amd.iso.zst -o amd.iso
Verify:
  sha256sum --check amd.iso.sha256

The checksum must report OK before writing the ISO to USB.
EOF
            ASSETS=(release-assets/amd.iso.zst.part-* release-assets/amd.iso.sha256 release-assets/README.txt)
          fi

          # Remove old split assets so the release does not show stale download instructions.
          for asset in amd.iso.part-00 amd.iso.part-01 amd.iso.sha256 README.txt amd.iso.zst; do
            gh release delete-asset "$TAG" "$asset" --yes >/dev/null 2>&1 || true
          done
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
          echo "Published release $TAG"
