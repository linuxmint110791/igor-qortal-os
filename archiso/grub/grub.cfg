# IgorCoin-Qortal OS — GNU GRUB 2.16 green boot menu
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod gfxterm
insmod font

if loadfont "${prefix}/fonts/unicode.pf2"; then
    set gfxmode="auto"
    terminal_output gfxterm
fi

set timeout=10
set timeout_style=menu
set default=igorcoin-live

# Classic GRUB menu, using IgorCoin green colours.
set menu_color_normal="light-green/black"
set menu_color_highlight="black/light-green"
set color_normal="light-green/black"
set color_highlight="black/light-green"

if [ "${grub_platform}" = "efi" ]; then
    archiso_platform="UEFI"
else
    archiso_platform="BIOS"
fi

menuentry "Start IgorCoin-Qortal OS (${archiso_platform})" --class gnu-linux --class os --id igorcoin-live {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Start IgorCoin-Qortal OS — safe graphics" --class gnu-linux --class os --id igorcoin-safe {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" = "efi" ]; then
    menuentry "UEFI Firmware Settings" --id uefi-firmware {
        fwsetup
    }
fi

menuentry "Restart computer" --class reboot --class restart {
    reboot
}

menuentry "Shut down computer" --class shutdown --class poweroff {
    halt
}
