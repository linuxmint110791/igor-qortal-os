---
dontChroot: false
timeout: 180
verbose: true
script:
  - "rm -f /etc/sddm.conf.d/10-live-session.conf"
  - "rm -f /etc/sudoers.d/99-liveuser"
  - "if id liveuser >/dev/null 2>&1; then userdel -r liveuser; fi"
  - "echo igorcoin-qortal > /etc/hostname"
  - "sed -i '/^\\[igorcoin\\]$/,/^$/d' /etc/pacman.conf"
  - "-pacman -Rns --noconfirm calamares"
  - "rm -f /root/customize_airootfs.sh"
