---
modules-search: [ local ]
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - bootloader
      - umount
  - show:
      - finished
branding: igorcoin-qortal
prompt-install: true
dont-chroot: false
disable-cancel: false
