---
modules-search: [ local ]
instances:
  - id: cleanup-live-session
    module: shellprocess
    config: shellprocess-cleanup-live.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - bootloader
      - shellprocess@cleanup-live-session
      - umount
  - show:
      - finished
branding: igorcoin-qortal
prompt-install: true
dont-chroot: false
disable-cancel: false
