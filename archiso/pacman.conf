#
# IgorCoin-Qortal OS — Arch Linux repositories
# xTom Estonia mirror first; official Arch mirrorlist as fallback.
# Mirror layout: /archlinux/<repo>/os/<arch>
#

[options]
HoldPkg = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://mirrors.xtom.ee/archlinux/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

[extra]
Server = https://mirrors.xtom.ee/archlinux/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist
